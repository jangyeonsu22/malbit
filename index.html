<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>말빛 - 공손한 말 변환기</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background-color: #f9e7f0;
      padding: 20px;
    }
    .container {
      max-width: 700px;
      margin: 0 auto;
      background: white;
      padding: 32px;
      border-radius: 20px;
      box-shadow: 0 4px 20px rgba(173, 125, 160, 0.1);
    }
    textarea, select, input {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      margin-bottom: 20px;
      border-radius: 10px;
      border: 1px solid #ccc;
    }
    button {
      padding: 12px 20px;
      border: none;
      border-radius: 10px;
      background: #d3929b;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    .result {
      background: #fff0f5;
      padding: 16px;
      border-radius: 10px;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>말빛</h1>
    <p>당신의 말에 따뜻한 빛을 더해요 ✨</p>

    <label>상황/장소:</label>
    <input type="text" id="situation" value="회사" />

    <label>대상/관계:</label>
    <input type="text" id="target" value="상사" />

    <label>말투 스타일:</label>
    <select id="toneStyle">
      <option value="polite">공손하고 친절</option>
      <option value="business">비즈니스 격식</option>
      <option value="rude">싸가지</option>
      <option value="firm" selected>단호하지만 정중</option>
    </select>

    <label>텍스트:</label>
    <textarea id="inputText" placeholder="예: 내일까지 보고서 줘">내일까지 보고서 줘</textarea>

    <label>고급 변환 (AI 사용):
      <input type="checkbox" id="useAdvanced" />
    </label>

    <label>응답 길이:</label>
    <select id="responseLength">
      <option value="50">50자</option>
      <option value="100" selected>100자</option>
      <option value="200">200자</option>
      <option value="500">500자</option>
    </select>

    <button id="transformButton">예쁜 말 변환</button>

    <div class="result" id="resultBox" style="display:none">
      <h3>변환 결과</h3>
      <p id="resultText"></p>
    </div>
  </div>

  <script>
    async function callGeminiAPI(prompt) {
      const response = await fetch('https://malbit-api.vercel.app/api/gemini', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({
          prompt,
          maxLength: parseInt(document.getElementById('responseLength').value),
          style: document.getElementById('toneStyle').value,
          situation: document.getElementById('situation').value,
          target: document.getElementById('target').value
        })
      });
      const data = await response.json();
      return data.result;
    }

    document.getElementById('transformButton').addEventListener('click', async () => {
      const text = document.getElementById('inputText').value.trim();
      const style = document.getElementById('toneStyle').value;
      const useAI = document.getElementById('useAdvanced').checked;

      if (!text) {
        alert('문장을 입력해주세요.');
        return;
      }

      let output = '';
      if (useAI) {
        try {
          output = await callGeminiAPI(`다음 문장을 ${style}한 말투로 바꿔줘: ${text}`);
        } catch (err) {
          output = '고급 변환 중 오류 발생';
        }
      } else {
        output = text.replace(/줘$/, '주시면 감사하겠습니다');
      }

      document.getElementById('resultText').innerText = output;
      document.getElementById('resultBox').style.display = 'block';
    });
  </script>
</body>
</html>
