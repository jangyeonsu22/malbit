<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>말빛 - 공손한 말 변환기 & 대화 응답기</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>말빛</h1>
      <p>당신의 말에 따뜻한 빛을 더해요</p>
    </div>

    <div id="transformForm">
      <div class="input-section">
        <div class="situation-target-group">
          <div style="flex: 1">
            <label>상황/장소:</label>
            <input type="text" id="situation" value="회사" placeholder="예: 회사, 학교, 병원" required>
          </div>
          <div style="flex: 1">
            <label>대상/관계:</label>
            <input type="text" id="target" value="상사" placeholder="예: 상사, 교수님, 환자" required>
          </div>
        </div>
        
        <div class="favorites-section">
          <button type="button" class="favorite-add-btn" id="addFavoriteBtn">현재 조합 즐겨찾기</button>
          <div id="favoriteCombinations" class="favorite-combinations">
            <!-- Favorites will be dynamically inserted here -->
          </div>
        </div>

        <div class="text-input-group" style="margin-top: 24px;">
          <div style="flex: 1;">
            <label>기능 선택:</label>
            <select id="mode">
              <option value="answer">질문에 답변하기</option>
              <option value="refine">답변을 다듬기</option>
            </select>
          </div>
        </div>

        <div class="text-input-group" style="margin-top: 16px;">
          <div style="flex: 1;">
            <label>말투 스타일:</label>
            <div class="tone-style-container">
              <select id="toneStyle">
                <option value="polite" data-tooltip="부드럽고 정중한 표현으로 말합니다">공손하고 친절</option>
                <option value="business" data-tooltip="격식있고 전문적인 어투로 표현합니다">비즈니스 격식</option>
                <option value="rude" data-tooltip="거칠고 직설적인 표현을 사용합니다">싸가지</option>
                <option value="firm" selected data-tooltip="자신감 있고 명확하게 표현하되 예의를 갖춥니다">단호하지만 정중</option>
              </select>
              <div class="tooltip" id="toneStyleTooltip"></div>
            </div>
          </div>
          <div style="flex: 2;">
            <label id="inputTextLabel">텍스트:</label>
            <textarea id="inputText" placeholder="예: 내일까지 보고서 줘" required>내일까지 보고서 줘</textarea>
          </div>
        </div>
      </div>

      <div class="premium-feature">
        <div class="premium-feature-header">
          <label for="useAdvanced" style="margin: 0; display: flex; align-items: center; gap: 8px;">
            <input type="checkbox" id="useAdvanced">
            <strong style="font-size: 18px; color: #ad7da0;">고급 변환</strong>
          </label>
          <span class="remaining-count" id="remainingCount">남은 횟수: 5/5</span>
        </div>
        <div style="font-size: 13px; color: #666; margin-top: 8px;">AI 기반 맞춤형 문장 업그레이드 (무료 5회)</div>

        <div style="margin-top: 16px;">
          <label>응답 길이:</label>
          <select id="responseLength">
            <option value="20">20자 이내 (매우 간단)</option>
            <option value="50">50자 이내 (간단)</option>
            <option value="100" selected>100자 이내 (보통)</option>
            <option value="200">200자 이내 (자세히)</option>
            <option value="500">500자 이내 (상세)</option>
            <option value="1000">1000자 이내 (매우 상세)</option>
          </select>
        </div>
      </div>

      <button type="button" class="btn" id="transformButton">결과 생성</button>
    </div>

    <div class="loading" style="display: none;">
      <div class="loading-spinner"></div>
      <p>변환 중입니다...</p>
    </div>

    <div class="result" style="display: none;">
      <h3>생성 결과:</h3>
      <p></p>
      <button class="copy-btn">결과 복사하기</button>
      <div class="actions">
        <div class="feedback-section">
          <div class="feedback-buttons">
            <button class="vote-btn">👍 좋아요</button>
            <button class="vote-btn">👎 별로예요</button>
          </div>
          <textarea id="feedbackText" placeholder="의견을 남겨주세요..." class="feedback-text"></textarea>
          <button class="submit-feedback-btn" id="submitFeedbackBtn">피드백 제출</button>
        </div>
      </div>
    </div>

    <div class="history-section" style="display: none;">
      <div class="history-header">
        <h3>최근 생성 기록</h3>
        <button class="clear-history" id="clearHistory">전체 삭제</button>
      </div>
      <div id="historyList"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
