<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>말빛 - 공손한 말 변환기</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif;
      background-color: #f9e7f0;
      margin: 0;
      padding: 20px;
      color: #333;
      line-height: 1.6;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: #fff;
      padding: 32px;
      border-radius: 20px;
      box-shadow: 0 4px 20px rgba(173, 125, 160, 0.1);
    }
    .header {
      text-align: center;
      margin-bottom: 32px;
    }
    .header h1 {
      color: #ad7da0;
      margin-bottom: 8px;
      font-size: 32px;
      font-weight: 700;
    }
    .header p {
      color: #d3929b;
      margin-top: 0;
      font-size: 16px;
      font-weight: 500;
    }
    .form-group {
      margin-bottom: 24px;
    }
    label {
      display: block;
      font-size: 15px;
      font-weight: 500;
      color: #ad7da0;
      margin-bottom: 8px;
    }
    input, textarea, select {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #f4dbd3;
      border-radius: 12px;
      font-size: 15px;
      background: #fff;
      transition: all 0.3s ease;
    }
    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: #d3929b;
      box-shadow: 0 0 0 3px rgba(211, 146, 155, 0.1);
    }
    textarea {
      min-height: 100px;
      resize: vertical;
    }
    .checkbox-group {
      display: flex;
      align-items: center;
      margin-bottom: 16px;
      padding: 8px;
      background: #fdf6f8;
      border-radius: 8px;
    }
    .checkbox-group input {
      width: auto;
      margin-right: 8px;
    }
    .btn {
      background: linear-gradient(135deg, #d3929b, #ad7da0);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 12px;
      width: 100%;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(211, 146, 155, 0.3);
    }
    .btn:active {
      transform: translateY(0);
    }
    .result {
      margin-top: 24px;
      padding: 20px;
      background-color: #fdf6f8;
      border: 2px solid #f4dbd3;
      border-radius: 12px;
    }
    .result h3 {
      margin-top: 0;
      color: #ad7da0;
      font-size: 18px;
      font-weight: 600;
    }
    .result p {
      background-color: #fff;
      padding: 16px;
      border-radius: 10px;
      border: 1px solid #f4dbd3;
      margin: 12px 0;
    }
    .actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 16px;
    }
    .feedback-section {
      display: none;
      flex-direction: column;
      align-items: flex-start;
      margin-top: 16px;
    }
    .feedback-buttons {
      display: flex;
      gap: 8px;
      margin-bottom: 6px;
    }
    .vote-btn {
      background-color: #fff;
      border: 2px solid #f4dbd3;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      color: #ad7da0;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .vote-btn:hover {
      background-color: #fdf6f8;
      border-color: #d3929b;
    }
    .copy-btn {
      background-color: #d3929b;
      color: white;
      border: none;
      padding: 8px 20px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .copy-btn:hover {
      background-color: #c17f88;
      transform: translateY(-1px);
    }
    .history-section {
      margin-top: 24px;
      padding: 20px;
      background-color: #fdf6f8;
      border: 2px solid #f4dbd3;
      border-radius: 12px;
    }
    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .history-header h3 {
      margin: 0;
      color: #ad7da0;
      font-size: 18px;
      font-weight: 600;
    }
    .clear-history {
      background: none;
      border: none;
      color: #d3929b;
      font-size: 14px;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 4px;
      transition: all 0.3s ease;
    }
    .clear-history:hover {
      background-color: #f4dbd3;
    }
    .history-item {
      padding: 12px;
      background: #fff;
      border-radius: 8px;
      margin-bottom: 8px;
      border: 1px solid #f4dbd3;
      font-size: 14px;
      transition: all 0.3s ease;
    }
    .history-item:hover {
      border-color: #d3929b;
      transform: translateX(2px);
    }
    .save-favorite-btn {
      background-color: #fff;
      border: 2px solid #d3929b;
      color: #ad7da0;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .save-favorite-btn:hover {
      background-color: #fdf6f8;
      transform: translateY(-1px);
    }
    .diagnostic {
      margin-top: 24px;
      padding: 20px;
      background-color: #fdf6f8;
      border: 2px solid #f4dbd3;
      border-radius: 12px;
    }
    .meter {
      height: 10px;
      background-color: #fff;
      border-radius: 5px;
      margin-bottom: 16px;
      overflow: hidden;
      border: 1px solid #f4dbd3;
    }
    .meter-fill {
      height: 100%;
      border-radius: 5px;
      transition: width 0.5s ease;
    }
    .meter-label {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      color: #666;
      margin-bottom: 6px;
    }
    .suggestions {
      background-color: #fff;
      padding: 16px;
      border-radius: 10px;
      border: 1px solid #f4dbd3;
      margin-top: 16px;
      font-size: 14px;
    }
    .advanced-options {
      background-color: #fdf6f8;
      border: 2px solid #f4dbd3;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 24px;
    }
    .input-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      margin-bottom: 32px;
    }
    
    .situation-target-group {
      display: flex;
      gap: 40px;
      width: 100%;
      max-width: 300px;
      margin: 0 auto;
    }

    .situation-target-group > div {
      flex: 1;
    }

    .situation-target-group input {
      width: 100%;
      padding: 8px 12px;
      border: 2px solid #f4dbd3;
      border-radius: 8px;
      font-size: 14px;
      background: #fff;
      transition: all 0.3s ease;
      height: 36px;
    }

    .situation-target-group input:focus {
      outline: none;
      border-color: #d3929b;
      box-shadow: 0 0 0 3px rgba(211, 146, 155, 0.1);
    }

    .text-input-group {
      width: 100%;
      max-width: 600px;
    }

    .favorites-section {
      margin-top: 16px;
      padding: 16px;
      background: #fdf6f8;
      border-radius: 12px;
      border: 2px solid #f4dbd3;
    }

    .favorites-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }

    .favorite-item {
      background: white;
      border: 1px solid #d3929b;
      border-radius: 20px;
      padding: 6px 12px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .favorite-item:hover {
      background: #fdf6f8;
      transform: translateY(-1px);
    }

    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px;
      background: #fff;
      border-radius: 8px;
      margin-bottom: 12px;
      border: 1px solid #f4dbd3;
    }

    .history-content {
      flex: 1;
    }

    .history-actions {
      display: flex;
      gap: 8px;
    }

    .delete-history {
      background: none;
      border: none;
      color: #f87171;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 4px;
      transition: all 0.3s ease;
    }

    .delete-history:hover {
      background: #fee2e2;
    }

    .premium-feature {
      background: #fdf6f8;
      border-radius: 12px;
      padding: 16px;
      margin-top: 16px;
    }

    .premium-feature-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .remaining-count {
      background: #d3929b;
      color: white;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 13px;
    }

    .style-example {
      font-size: 13px;
      color: #666;
      margin-top: 4px;
      font-style: italic;
    }

    .style-description {
      font-size: 13px;
      color: #666;
      margin-top: 8px;
      padding: 8px;
      background: white;
      border-radius: 8px;
      border: 1px solid #f4dbd3;
    }
    
    .style-description ul {
      margin: 4px 0;
      padding-left: 20px;
    }
    
    .style-description li {
      margin: 2px 0;
    }

    .premium-feature-header label strong {
      font-size: 16px;
      color: #ad7da0;
    }

    .feedback-message {
      font-size: 12px;
      color: #666;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>말빛</h1>
      <p>당신의 말에 따뜻한 빛을 더해요</p>
    </div>
    
    <div id="transformForm">
      <div class="input-section">
        <div class="situation-target-group">
          <div style="flex: 1">
            <label>상황/장소:</label>
            <input type="text" id="situation" value="회사" placeholder="예: 회사, 학교, 병원" required>
          </div>
          <div style="flex: 1">
            <label>대상/관계:</label>
            <input type="text" id="target" value="상사" placeholder="예: 상사, 교수님, 환자" required>
          </div>
        </div>
        
        <div style="text-align: center;">
          <button type="button" class="save-favorite-btn" id="saveFavorite">현재 조합 즐겨찾기 저장</button>
        </div>

        <div class="favorites-section">
          <h4 style="margin: 0">저장된 조합</h4>
          <div class="favorites-list" id="favoritesList">
            <!-- 즐겨찾기 항목들이 여기에 추가됩니다 -->
          </div>
        </div>

        <div class="text-input-group">
          <label>텍스트:</label>
          <textarea id="inputText" placeholder="예: 내일까지 보고서 줘" required>내일까지 보고서 줘</textarea>
        </div>
      </div>

      <div>
        <button type="button" id="toggleAdvanced" style="border: none; background: none; color: #ad7da0; font-size: 14px; padding: 8px 0; margin-bottom: 12px; cursor: pointer; font-weight: 500;" onclick="toggleAdvancedOptions()">
          말투 스타일 변경 ▼
        </button>
      </div>
      
      <div class="advanced-options" style="display: none;">
        <div style="margin-bottom: 16px;">
          <label>말투 스타일:</label>
          <select id="toneStyle">
            <option value="polite">공손하고 친절</option>
            <option value="business">비즈니스 격식</option>
            <option value="rude">싸가지</option>
            <option value="firm" selected>단호하지만 정중</option>
          </select>
          <div class="style-description" id="styleDescription">
            <!-- 말투 스타일 설명이 여기에 동적으로 추가됩니다 -->
          </div>
        </div>
      </div>
      
      <div class="premium-feature">
        <div class="premium-feature-header">
          <label for="useAdvanced" style="margin: 0">
            <strong>고급 변환</strong>
            <div style="font-size: 13px; color: #666;">AI 기반 맞춤형 문장 업그레이드 (무료 5회)</div>
          </label>
          <span class="remaining-count" id="remainingCount">남은 횟수: 5/5</span>
        </div>
        <input type="checkbox" id="useAdvanced" style="margin-top: 8px;">
      </div>
      
      <button type="button" class="btn" id="transformButton" onclick="transformText()">예쁜 말 변환</button>
    </div>
    
    <div class="loading" style="display: none;">
      <div class="loading-spinner"></div>
      <p>변환 중입니다...</p>
    </div>

    <div class="result" style="display: none;">
      <h3>변환 결과:</h3>
      <p>내일까지 보고서 주시면 감사드립니다. 기한 내 처리하겠습니다.</p>
      
      <div class="actions">
        <div class="feedback-section">
          <div class="feedback-buttons">
            <button class="vote-btn">👍 좋아요</button>
            <button class="vote-btn">👎 별로예요</button>
          </div>
          <span class="feedback-message">
            사용자 피드백을 통해 더 나은 맞춤형 변환 서비스로 개선됩니다
          </span>
        </div>
        <div style="display: flex; gap: 8px;">
          <button class="copy-btn">결과 복사</button>
        </div>
      </div>
    </div>
    
    <div class="diagnostic" style="display: none;">
      <h3>말투 진단 결과:</h3>
      
      <div>
        <div class="meter-label">
          <span>직설성</span>
          <span>70%</span>
        </div>
        <div class="meter">
          <div class="meter-fill" style="width: 70%; background-color: #d3929b;"></div>
        </div>
      </div>
      
      <div>
        <div class="meter-label">
          <span>정중함</span>
          <span>20%</span>
        </div>
        <div class="meter">
          <div class="meter-fill" style="width: 20%; background-color: #4ade80;"></div>
        </div>
      </div>
      
      <div>
        <div class="meter-label">
          <span>오해 위험도</span>
          <span>50%</span>
        </div>
        <div class="meter">
          <div class="meter-fill" style="width: 50%; background-color: #f87171;"></div>
        </div>
      </div>
      
      <div class="suggestions">
        <p style="font-weight: 500; margin-top: 0; margin-bottom: 8px">개선 제안:</p>
        <ul style="margin: 0; padding-left: 20px">
          <li>직설적인 표현이 다소 강합니다. 요청할 때는 부드러운 표현을 고려해보세요.</li>
          <li>정중함이 부족할 수 있습니다. 존칭이나 부탁 표현을 추가해보세요.</li>
        </ul>
      </div>
    </div>
    
    <div class="history-section">
      <div class="history-header">
        <h3>최근 변환 기록</h3>
        <button class="clear-history" id="clearHistory" onclick="clearHistory()">전체 삭제</button>
      </div>
      <div id="historyList"></div>
    </div>
  </div>

  <script>
    const API_KEY = '여기에_API_키_입력';
    
    // 어색한 변환 방지 규칙
    const isBanCombination = (ending, addOn) => {
      const banned = {
        "줘": ["바랍니다", "하겠습니다", "하지만", "다만"],
        "해": ["바랍니다", "하겠습니다", "하지만", "다만"],
        "좀": ["바랍니다", "하겠습니다", "하지만", "다만"],
        "요청": ["바랍니다", "하겠습니다", "하지만", "다만"],
        "부탁": ["바랍니다", "하겠습니다", "하지만", "다만"]
      };
      return banned[ending]?.includes(addOn);
    };

    const hasTrailingConjunction = (sentence) => {
      return /(하지만|다만)\s*$/.test(sentence);
    };

    const isAwkward = (sentence) => {
      return (
        sentence.includes("줘 바랍니다") ||
        sentence.includes("줘 하겠습니다") ||
        sentence.includes("줘 하지만") ||
        sentence.includes("줘 다만") ||
        sentence.includes("해 바랍니다") ||
        sentence.includes("해 하겠습니다") ||
        sentence.includes("해 하지만") ||
        sentence.includes("해 다만") ||
        hasTrailingConjunction(sentence)
      );
    };

    // 동사 치환 사전
    const verbReplacements = {
      "줘": ["제출", "전달", "공유"],
      "해": ["수행", "진행", "처리"],
      "말해": ["말씀", "전달"],
      "확인해": ["확인", "검토"],
      "적어": ["작성", "기입"]
    };

    // 금지된 조합
    const bannedCombinations = [
      "주시다 좀 주세요",
      "주시다 부탁드립니다",
      "주시다 하겠습니다",
      "주시다 하지만",
      "주시다 다만",
      "주시다 꼭 부탁드립니다",
      "제출 좀 주세요",
      "검토 좀 주세요",
      "작성 좀 주세요",
      "전달 좀 주세요",
      "공유 좀 주세요"
    ];

    // 명사 → 동사구 치환 맵
    const nounToVerbMap = {
      "제출": "제출해",
      "검토": "검토해",
      "작성": "작성해",
      "전달": "전달해",
      "공유": "공유해"
    };

    // 어색한 문장 수정 함수
    function fixAwkwardSentence(sentence) {
      for (const [noun, verb] of Object.entries(nounToVerbMap)) {
        if (sentence.includes(noun + " 좀 주세요")) {
          return sentence.replace(noun + " 좀 주세요", verb + " 주세요");
        }
      }
      return sentence;
    }

    function isInvalidPhrase(sentence) {
      return bannedCombinations.some(phrase => sentence.includes(phrase));
    }

    // 동사 치환 함수
    function replaceVerb(text) {
      let result = text;
      Object.entries(verbReplacements).forEach(([key, replacements]) => {
        if (result.includes(key)) {
          const randomReplacement = replacements[Math.floor(Math.random() * replacements.length)];
          result = result.replace(key, randomReplacement);
        }
      });
      return result;
    }

    // 사용자 피드백을 저장할 객체
    const userFeedback = {
      polite: { good: [], bad: [] },
      business: { good: [], bad: [] },
      firm: { good: [], bad: [] },
      rude: { good: [], bad: [] }
    };

    // 피드백 저장 함수
    function saveFeedback(style, template, isGood) {
      if (isGood) {
        userFeedback[style].good.push(template);
      } else {
        userFeedback[style].bad.push(template);
      }
      // 로컬 스토리지에 저장
      localStorage.setItem('userFeedback', JSON.stringify(userFeedback));
    }

    // 템플릿 선택 함수 (피드백 반영)
    function selectTemplate(style, templates) {
      const feedback = JSON.parse(localStorage.getItem('userFeedback') || '{}')[style] || { good: [], bad: [] };
      
      // 좋은 피드백이 있는 템플릿 우선 선택
      const goodTemplates = templates.filter(t => feedback.good.includes(t));
      if (goodTemplates.length > 0) {
        return goodTemplates[Math.floor(Math.random() * goodTemplates.length)];
      }
      
      // 나쁜 피드백이 없는 템플릿 중에서 선택
      const neutralTemplates = templates.filter(t => !feedback.bad.includes(t));
      if (neutralTemplates.length > 0) {
        return neutralTemplates[Math.floor(Math.random() * neutralTemplates.length)];
      }
      
      // 모든 템플릿이 나쁜 피드백을 받았다면 랜덤 선택
      return templates[Math.floor(Math.random() * templates.length)];
    }

    // 말투 스타일별 변환 규칙
    const styleRules = {
      polite: {
        name: '공손하고 친절',
        templates: [
          "혹시 {task}해 주실 수 있을까요?",
          "{task}해 주시면 감사하겠습니다",
          "{task}해 주시면 정말 도움이 될 것 같아요",
          "{task}, 부탁드려도 괜찮을까요?"
        ],
        transform: (text, isRetry = false) => {
          let task = text.replace(/[^가-힣\s]+$/g, '').trim();
          task = replaceVerb(task);

          if (isRetry) {
            const selectedTemplate = selectTemplate(style, styleRules[style].templates);

    async function transformWithGPT(text, style) {
      if (!API_KEY) {
        alert('GPT API 키가 설정되지 않았습니다.');
        return text;
      }

      try {
        const response = await fetch('https://api.openai.com/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${API_KEY}`
          },
          body: JSON.stringify({
            model: 'gpt-3.5-turbo',
            messages: [{
              role: 'system',
              content: `당신은 문장을 ${styleRules[style].name} 말투로 변환하는 전문가입니다. 
              다음 규칙을 따라주세요:
              - ${JSON.stringify(styleRules[style].rules)}
              - 원문의 의미는 유지하면서 말투만 변경해주세요.
              - 응답은 최소 2줄 이상으로 작성해주세요.
              - 더 공손하고 상세하게 표현해주세요.`
            }, {
              role: 'user',
              content: text
            }],
            temperature: 0.7
          })
        });

        const data = await response.json();
        return data.choices[0].message.content;
      } catch (error) {
        console.error('GPT API 호출 중 오류:', error);
        return styleRules[style].transform(text);
      }
    }

    // 전역 함수로 변환 함수 추가
    async function transformText() {
      console.log('변환 버튼 클릭됨');
      const inputText = document.getElementById('inputText').value;
      const selectedStyle = document.getElementById('toneStyle').value;
      const useAdvanced = document.getElementById('useAdvanced');
      const remainingCount = document.getElementById('remainingCount');
      let premiumUsageCount = 5;
      
      document.querySelector('.loading').style.display = 'block';
      document.querySelector('.result').style.display = 'none';
      document.querySelector('.diagnostic').style.display = 'none';

      let transformedText;
      if (useAdvanced && useAdvanced.checked) {
        if (premiumUsageCount <= 0) {
          alert('무료 사용 횟수를 모두 소진하셨습니다.');
          document.querySelector('.loading').style.display = 'none';
          return;
        }
        premiumUsageCount--;
        remainingCount.textContent = `남은 횟수: ${premiumUsageCount}/5`;
        
        transformedText = await transformWithGPT(inputText, selectedStyle);
      } else {
        transformedText = styleRules[selectedStyle].transform(inputText);
      }

      setTimeout(() => {
        document.querySelector('.loading').style.display = 'none';
        document.querySelector('.result').style.display = 'block';
        document.querySelector('.diagnostic').style.display = 'block';
        document.querySelector('.history-section').style.display = 'block';

        document.querySelector('.result p').textContent = transformedText;
        
        // 고급 변환 시에만 피드백 버튼과 문구 표시
        const feedbackSection = document.querySelector('.feedback-section');
        if (useAdvanced && useAdvanced.checked) {
          feedbackSection.style.display = 'flex';
        } else {
          feedbackSection.style.display = 'none';
        }
        
        addToHistory(inputText, transformedText, selectedStyle);
      }, 1500);
    }

    // 기록 추가 함수
    function addToHistory(originalText, transformedText, style) {
      const historyList = document.getElementById('historyList');
      const historyItem = document.createElement('div');
      historyItem.className = 'history-item';
      
      const content = document.createElement('div');
      content.className = 'history-content';
      content.innerHTML = `
        <div><strong>원문:</strong> ${originalText}</div>
        <div><strong>변환:</strong> ${transformedText}</div>
        <div style="color: #666; font-size: 12px;">스타일: ${styleRules[style].name}</div>
      `;
      
      const actions = document.createElement('div');
      actions.className = 'history-actions';
      const deleteBtn = document.createElement('button');
      deleteBtn.className = 'delete-history';
      deleteBtn.textContent = '삭제';
      deleteBtn.onclick = function() {
        historyList.removeChild(historyItem);
      };
      
      actions.appendChild(deleteBtn);
      historyItem.appendChild(content);
      historyItem.appendChild(actions);
      
      if (historyList.children.length >= 5) {
        historyList.removeChild(historyList.lastChild);
      }
      
      historyList.insertBefore(historyItem, historyList.firstChild);
    }
